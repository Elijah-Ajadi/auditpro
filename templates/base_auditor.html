<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{% block title %}Audit Pro - Auditor{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'core/img/logo.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-deep: #030712;
        --bg-surface: #111827;
        --bg-glass: rgba(17, 24, 39, 0.8);
        --bg-muted: #1f2937;
        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;
        --text-muted: #4b5563;
        --accent-teal: #22d3ee;
        --accent-teal-soft: rgba(34, 211, 238, 0.1);
        --accent-warning: #fbbf24;
        --accent-success: #10b981;
        --accent-error: #ef4444;
        --accent-purple: #818cf8;
        --border-glass: rgba(255, 255, 255, 0.05);
        --glass-blur: blur(16px);
        --thumb-zone: 38vh;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        overflow: hidden;
        background: var(--bg-deep);
    }

    body {
        font-family: 'Outfit', sans-serif;
        color: var(--text-primary);
        line-height: 1.5;
        touch-action: manipulation;
    }

    .auditor-header {
        background: var(--bg-glass);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-bottom: 1px solid var(--border-glass);
        padding: 0.875rem 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
    }

    .auditor-header h1 {
        font-size: 1.125rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        background: linear-gradient(135deg, #fff 0%, #9ca3af 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .auditor-header .zone-badge {
        background: var(--accent-teal-soft);
        color: var(--accent-teal);
        padding: 0.375rem 0.875rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 800;
        border: 1px solid rgba(34, 211, 238, 0.2);
    }

    .auditor-content {
        padding-top: 4.5rem;
        padding-bottom: var(--thumb-zone);
        height: 100vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background-image: 
            radial-gradient(at 100% 0%, rgba(34, 211, 238, 0.05) 0px, transparent 50%),
            radial-gradient(at 0% 100%, rgba(129, 140, 248, 0.05) 0px, transparent 50%);
    }

    .thumb-zone {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: var(--thumb-zone);
        background: var(--bg-glass);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-top: 1px solid var(--border-glass);
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 0.875rem;
        z-index: 90;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 1rem 1.5rem;
        border-radius: 1rem;
        font-size: 1rem;
        font-weight: 800;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        width: 100%;
        text-transform: uppercase;
        letter-spacing: 0.025em;
    }

    .btn:active {
        transform: scale(0.96);
    }

    .btn-primary {
        background: linear-gradient(135deg, #22d3ee 0%, #0891b2 100%);
        color: #030712;
        box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
    }

    .btn-secondary {
        background: var(--bg-muted);
        color: var(--text-primary);
        border: 1px solid var(--border-glass);
    }

    .btn-large {
        padding: 1.25rem 1.5rem;
        font-size: 1.125rem;
    }

    .input-field {
        width: 100%;
        padding: 1.125rem;
        background: rgba(255, 255, 255, 0.03);
        border: 2px solid var(--border-glass);
        border-radius: 1rem;
        color: var(--text-primary);
        font-size: 1.125rem;
        font-weight: 600;
        outline: none;
        transition: all 0.2s ease;
    }

    .input-field:focus {
        border-color: var(--accent-teal);
        background: rgba(255, 255, 255, 0.05);
        box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.1);
    }

    .scan-border-pulse {
        animation: borderPulse 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes borderPulse {
        0% { box-shadow: inset 0 0 0 4px var(--accent-success), 0 0 20px rgba(16, 185, 129, 0.4); }
        100% { box-shadow: inset 0 0 0 0 var(--accent-success), 0 0 0 transparent; }
    }

    .scan-border-warning {
        animation: borderWarning 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes borderWarning {
        0% { box-shadow: inset 0 0 0 4px var(--accent-warning), 0 0 20px rgba(251, 191, 36, 0.4); }
        100% { box-shadow: inset 0 0 0 0 var(--accent-warning), 0 0 0 transparent; }
    }

    .overlay-lock {
        position: fixed;
        inset: 0;
        background: var(--bg-deep);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .progress-bar-container {
        width: 80%;
        max-width: 320px;
        height: 6px;
        background: var(--bg-muted);
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 1.5rem;
    }

    .progress-bar-fill {
        height: 100%;
        background: var(--accent-teal);
        border-radius: 9999px;
        transition: width 0.3s ease;
        box-shadow: 0 0 12px var(--accent-teal);
    }

    .text-amber { color: var(--accent-warning); }
    .text-green { color: var(--accent-success); }
    .text-red { color: var(--accent-error); }
    .text-purple { color: var(--accent-purple); }
</style>
</head>
<body>
{% block main %}{% endblock %}
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/auditor/sw.js', { scope: '/auditor/' })
                .then(reg => console.log('DEBUG: ServiceWorker Registered', reg.scope))
                .catch(err => console.log('DEBUG: ServiceWorker Error', err));
        });
    }
</script>
</body>
</html>
